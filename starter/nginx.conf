# pagine HTML, e CSS e JS senza la versione giusta: browser e Cloudflare verificano sempre se sono cambiati
# (risposta 304 se uguali). Immagini e font in /assets/ hanno la loro cache lunga.
map $sent_http_content_type $html_cache {
    ~text/html              "no-cache";
    ~text/css               "no-cache";
    ~javascript             "no-cache";
    default                 "";
}

# style.css e script.js con la versione giusta nell'indirizzo (?v= uguale all'impronta del file): cache di un anno.
# Le impronte le scrive il Dockerfile a ogni deploy. Con una versione diversa (es. la copia vecchia del sito che
# risponde ancora durante un deploy) niente cache lunga: così il CSS vecchio non resta mai al nuovo indirizzo.
map "$uri?$arg_v" $cache_control {
    "/style.css?VERSIONE_CSS"   "public, max-age=31536000, immutable";
    "/script.js?VERSIONE_JS"    "public, max-age=31536000, immutable";
    default                     $html_cache;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # dietro il proxy di Coolify: redirect relativi (restano su https)
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control $cache_control always;

    # NB: il sito funziona anche senza questo file (una cartella per pagina: /privacy-policy/index.html).
    # Qui ci sono solo gli extra: pagina 404, cache, compressione, eventuali vecchi indirizzi.

    # solo se il sito sostituisce un sito WordPress: togli il # alle righe seguenti
    # location ^~ /wp-content/ { return 301 /; }
    # location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|feed) { return 404; }
    # pagine con un indirizzo nuovo, una riga per pagina:
    # location = /vecchio-indirizzo/ { return 301 /nuovo-indirizzo/; }

    # immagini, font, CSS e JS: cache lunga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # template e copia degli articoli di SiteHub (anche le bozze): mai pubblici
    location ^~ /_sitehub/ { return 404; }

    error_page 404 /404.html;
}
